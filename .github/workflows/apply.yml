# Apply al hacer merge a main, en orden de etapas 1 -> 5 y por entorno: comunes -> dev -> qa -> prod.
# 0-bootstrap no se aplica aquí: lo ejecuta un administrador (runbook bootstrap-first-apply.md).
# dev y qa se aplican solos; cada job de prod y de las etapas comunes (1-org, 2-security, 3-networks/hub) espera la
# aprobación del environment "prod" (Settings > Environments > prod): sus SA solo se impersonan desde ese environment
# y sobre main. GitHub pide UNA sola aprobación de la lista de reviewers del environment; las dos aprobaciones de QA
# las exige el job qa-approval (ADR 0021-k) antes de cualquier job que use el environment prod.
# Solo se aplican las raíces afectadas por el push; workflow_dispatch aplica todas.
# Entre dev y qa corre tests-dev (pruebas de humo de dev): si fallan, qa y prod no se aplican.
# Si cambia gcp-datacenter/release/prod-images.txt, attest-prod firma esas imágenes para Binary Authorization de prod,
# también detrás de qa-approval (ADR 0022-k).
name: apply

on:
  push:
    branches: [main]
    paths:
      - "gcp-datacenter/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      roots: ${{ steps.discover.outputs.roots }}
      images: ${{ steps.discover.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: discover
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          d=gcp-datacenter/scripts/discover-roots.sh
          manifest=gcp-datacenter/release/prod-images.txt
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            roots=$(bash "$d" roots --json)
            images=true
          else
            roots=$(git diff --name-only "$BEFORE" HEAD | bash "$d" changed --json)
            if git diff --quiet "$BEFORE" HEAD -- "$manifest"; then images=false; else images=true; fi
          fi
          echo "Imágenes de prod a firmar: $images"
          echo "images=$images" >>"$GITHUB_OUTPUT"
          # La cadena de jobs de abajo lista las raíces del contrato; una raíz nueva debe agregarse a mano.
          known='["gcp-datacenter/stages/0-bootstrap","gcp-datacenter/stages/1-org","gcp-datacenter/stages/2-security","gcp-datacenter/stages/3-networks/hub",
            "gcp-datacenter/stages/3-networks/envs/dev","gcp-datacenter/stages/3-networks/envs/qa","gcp-datacenter/stages/3-networks/envs/prod",
            "gcp-datacenter/stages/4-projects/envs/dev","gcp-datacenter/stages/4-projects/envs/qa","gcp-datacenter/stages/4-projects/envs/prod",
            "gcp-datacenter/stages/5-workloads/envs/dev","gcp-datacenter/stages/5-workloads/envs/qa","gcp-datacenter/stages/5-workloads/envs/prod"]'
          jq -r --argjson known "$known" '.[] | select(. as $r | $known | index($r) | not)' <<<"$roots" |
            while IFS= read -r r; do echo "::warning::$r no está en la cadena de apply.yml; no se aplicará"; done
          echo "Raíces a aplicar: $roots"
          echo "roots=$roots" >>"$GITHUB_OUTPUT"

  # Puerta de QA (ADR 0021-k): si el push afecta una raíz de prod o una etapa común (las que usan el environment
  # prod), el PR fusionado debe tener al menos 2 aprobaciones de usuarios de QA (variable QA_APPROVERS) sobre su
  # último commit. Corre con el código de main, no con el de la rama del PR. Si falla, no se aplica nada de este push.
  qa-approval:
    needs: detect
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        name: Raíces e imágenes que exigen aprobación de QA
        env:
          ROOTS: ${{ needs.detect.outputs.roots }}
          IMAGES: ${{ needs.detect.outputs.images }}
        run: |
          gated=$(jq -c --arg images "$IMAGES" '[.[] | select(test("/envs/prod$") or IN("gcp-datacenter/stages/1-org", "gcp-datacenter/stages/2-security", "gcp-datacenter/stages/3-networks/hub"))]
            + (if $images == "true" then ["gcp-datacenter/release/prod-images.txt"] else [] end)' <<<"$ROOTS")
          echo "Raíces de prod o comunes en este push: $gated"
          echo "gated=$gated" >>"$GITHUB_OUTPUT"
      - if: steps.scope.outputs.gated != '[]'
        name: Al menos 2 aprobaciones de QA en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          QA_APPROVERS: ${{ vars.QA_APPROVERS }}
          # Excepción temporal (ADR 0021-k): la variable QA_MIN_APPROVALS baja el mínimo; sin ella son 2.
          QA_MIN_APPROVALS: ${{ vars.QA_MIN_APPROVALS || '2' }}
        run: |
          if [ "$QA_MIN_APPROVALS" -lt 2 ]; then
            echo "::warning::puerta de QA relajada: QA_MIN_APPROVALS=$QA_MIN_APPROVALS (excepción temporal, ADR 0021-k)"
            echo "⚠️ Puerta de QA relajada a $QA_MIN_APPROVALS aprobación(es)" >>"$GITHUB_STEP_SUMMARY"
          fi
          bash gcp-datacenter/scripts/check-qa-approvals.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  # Binary Authorization de prod (ADR 0022-k): firma las imágenes de release/prod-images.txt con el attestor
  # qa-approved. Corre solo después de qa-approval y en el environment prod: la SA attestor-prod solo se impersona ahí
  # y sobre main, y solo puede firmar con la llave del attestor.
  attest-prod:
    needs: [detect, qa-approval]
    if: needs.detect.outputs.images == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar variables y gcloud
        env:
          SA: ${{ vars.TF_SA_ATTESTOR_PROD }}
          WIF: ${{ vars.WIF_PROVIDER }}
          ATTESTOR: ${{ vars.BINAUTHZ_ATTESTOR }}
          KEY_VERSION: ${{ vars.BINAUTHZ_KEY_VERSION }}
        run: |
          [ -n "$SA" ] || { echo "::error::falta la variable TF_SA_ATTESTOR_PROD"; exit 1; }
          [ -n "$WIF" ] || { echo "::error::falta la variable WIF_PROVIDER"; exit 1; }
          [ -n "$ATTESTOR" ] || { echo "::error::falta la variable BINAUTHZ_ATTESTOR"; exit 1; }
          [ -n "$KEY_VERSION" ] || { echo "::error::falta la variable BINAUTHZ_KEY_VERSION"; exit 1; }
          command -v gcloud >/dev/null || { echo "::error::el runner no trae gcloud"; exit 1; }
          gcloud --version | head -1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_ATTESTOR_PROD }}
      - name: Firmar imágenes aprobadas por QA
        env:
          BINAUTHZ_ATTESTOR: ${{ vars.BINAUTHZ_ATTESTOR }}
          BINAUTHZ_KEY_VERSION: ${{ vars.BINAUTHZ_KEY_VERSION }}
        run: bash gcp-datacenter/scripts/attest-images.sh sign gcp-datacenter/release/prod-images.txt

  org:
    needs: [detect, qa-approval]
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/1-org, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }

  security:
    needs: [detect, org]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/2-security, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }

  net-hub:
    needs: [detect, security]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/3-networks/hub, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }

  # ---- dev ----
  net-dev:
    needs: [detect, net-hub]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/3-networks/envs/dev, environment: dev, roots: "${{ needs.detect.outputs.roots }}" }

  projects-dev:
    needs: [detect, net-dev]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/4-projects/envs/dev, environment: dev, roots: "${{ needs.detect.outputs.roots }}" }

  workloads-dev:
    needs: [detect, projects-dev]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/5-workloads/envs/dev, environment: dev, roots: "${{ needs.detect.outputs.roots }}" }

  # Puerta de dev: qa y prod se aplican solo si dev quedó sano (plan sin cambios, GKE, Cloud SQL y MIG).
  # Corre en cada apply con raíces afectadas, aunque dev no haya cambiado.
  tests-dev:
    needs: [detect, workloads-dev]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.roots != '[]' }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with:
      root: gcp-datacenter/stages/5-workloads/envs/dev
      environment: dev
      roots: "${{ needs.detect.outputs.roots }}"
      mode: smoke

  # ---- qa (después de las pruebas de dev) ----
  net-qa:
    needs: [detect, tests-dev]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/3-networks/envs/qa, environment: qa, roots: "${{ needs.detect.outputs.roots }}" }

  projects-qa:
    needs: [detect, net-qa]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/4-projects/envs/qa, environment: qa, roots: "${{ needs.detect.outputs.roots }}" }

  workloads-qa:
    needs: [detect, projects-qa]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/5-workloads/envs/qa, environment: qa, roots: "${{ needs.detect.outputs.roots }}" }

  # ---- prod (después de qa; cada job espera aprobación del environment prod) ----
  net-prod:
    needs: [detect, workloads-qa]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/3-networks/envs/prod, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }

  projects-prod:
    needs: [detect, net-prod]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/4-projects/envs/prod, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }

  workloads-prod:
    needs: [detect, projects-prod]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_tf-apply.yml
    permissions: { contents: read, id-token: write }
    with: { root: gcp-datacenter/stages/5-workloads/envs/prod, environment: prod, roots: "${{ needs.detect.outputs.roots }}" }
