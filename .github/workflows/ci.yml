# CI de pull requests: estáticos, pruebas de módulos, pruebas de políticas y plan por raíz afectada.
# Variables de GitHub (Settings > Secrets and variables > Actions > Variables), ver gcp-datacenter/docs/README.md:
#   WIF_PROVIDER, TF_STATE_BUCKET, TF_SA_PLAN, TF_VAR_ORG_ID, TF_VAR_BILLING_ACCOUNT, TF_VAR_SUFFIX,
#   TF_LABELS_JSON, NOTIFICATION_EMAIL
# Secreto opcional: INFRACOST_API_KEY (clave gratuita de Infracost). Sin él se omite la estimación de costo del plan.
name: ci

on:
  pull_request:
    branches: [main]
    paths:
      - "gcp-datacenter/**"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.17.2"

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      roots: ${{ steps.discover.outputs.roots }}
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          roots=$(git diff --name-only "$BASE_SHA"...HEAD | bash gcp-datacenter/scripts/discover-roots.sh changed --json)
          modules=$(bash gcp-datacenter/scripts/discover-roots.sh modules --json)
          echo "Raíces afectadas: $roots"
          echo "Módulos con pruebas: $modules"
          echo "roots=$roots" >>"$GITHUB_OUTPUT"
          echo "modules=$modules" >>"$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff gcp-datacenter

  tflint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gcp-datacenter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - run: tflint --init --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Raíces de etapa y módulos propios.
      - run: |
          rc=0
          dirs=$(bash scripts/discover-roots.sh roots | sed 's#^gcp-datacenter/##')
          for m in modules/*/; do
            m=${m%/}
            dirs+=$'\n'"$m"
          done
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            echo "::group::tflint $d"
            tflint --chdir "$d" --config "$PWD/.tflint.hcl" --format compact || rc=1
            echo "::endgroup::"
          done <<<"$dirs"
          exit "$rc"

  checkov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # soft-fail desactivado y lista de omisiones documentada en gcp-datacenter/.checkov.yaml
      - uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0 (checkov 3.4.3)
        with:
          directory: gcp-datacenter
          config_file: gcp-datacenter/.checkov.yaml
          framework: terraform
          soft_fail: false

  policy-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-conftest
      - name: conftest verify (pruebas unitarias rego)
        run: conftest verify --no-color --policy gcp-datacenter/policies
      - name: Plan de ejemplo que cumple pasa
        run: conftest test --no-color --policy gcp-datacenter/policies gcp-datacenter/policies/testdata/plan-pass.json
      - name: Plan de ejemplo que viola políticas es rechazado
        run: |
          if conftest test --no-color --policy gcp-datacenter/policies gcp-datacenter/policies/testdata/plan-fail.json; then
            echo "::error::plan-fail.json debió ser rechazado por las políticas"
            exit 1
          fi

  # Pruebas de los scripts del pipeline (puerta de QA, ADR 0021-k; firma de imágenes, ADR 0022-k) con gh y gcloud
  # falsos, sin red ni credenciales, y formato de release/prod-images.txt.
  script-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Puerta de aprobaciones de QA
        run: bash gcp-datacenter/scripts/tests/check-qa-approvals.test.sh
      - name: Firma de imágenes de prod
        run: bash gcp-datacenter/scripts/tests/attest-images.test.sh
      - name: Formato de release/prod-images.txt (solo digests)
        run: bash gcp-datacenter/scripts/attest-images.sh check gcp-datacenter/release/prod-images.txt

  # terraform test en cada módulo y raíz de etapa con carpeta tests/ (proveedores simulados, sin credenciales).
  module-tests:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tf-init
        with:
          root: ${{ matrix.module }}
          terraform_version: ${{ env.TF_VERSION }}
      - env:
          MODULE: ${{ matrix.module }}
        run: terraform -chdir="$MODULE" test -no-color

  # Terratest sin credenciales: compila las pruebas Go y valida cada fixture. Detecta en el PR un cambio de
  # variables o salidas de un módulo que rompería la corrida nocturna (terratest.yml).
  terratest-compile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gcp-datacenter/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: gcp-datacenter/test/go.mod
          cache-dependency-path: gcp-datacenter/test/go.sum
      - run: go vet ./...
      # -run XXX no coincide con ninguna prueba: solo compila.
      - run: go test -run XXX ./...
      - run: |
          rc=0
          terraform fmt -check -recursive -diff fixtures || rc=1
          for d in fixtures/*/; do
            echo "::group::validate $d"
            { terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null &&
              terraform -chdir="$d" validate -no-color; } || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  validate:
    needs: detect
    if: needs.detect.outputs.roots != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.detect.outputs.roots) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tf-init
        with:
          root: ${{ matrix.root }}
          terraform_version: ${{ env.TF_VERSION }}
      - env:
          ROOT: ${{ matrix.root }}
        run: terraform -chdir="$ROOT" validate -no-color

  plan:
    needs: [detect, validate, policy-tests]
    if: needs.detect.outputs.roots != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.detect.outputs.roots) }}
    env:
      ROOT: ${{ matrix.root }}
      TF_VAR_org_id: ${{ vars.TF_VAR_ORG_ID }}
      TF_VAR_billing_account: ${{ vars.TF_VAR_BILLING_ACCOUNT }}
      TF_VAR_suffix: ${{ vars.TF_VAR_SUFFIX }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_labels: ${{ vars.TF_LABELS_JSON }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      # Igual que _tf-apply.yml: sin esto el plan de 1-org mostraría quitar el bloqueo de auditoría.
      TF_VAR_audit_retention_locked: ${{ vars.AUDIT_RETENTION_LOCKED || 'true' }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin backend.tf (p. ej. 0-bootstrap antes de migrar su estado) el plan no tendría estado: se omite.
      - id: backend
        run: |
          if [ -f "$ROOT/backend.tf" ]; then echo "present=true" >>"$GITHUB_OUTPUT"; else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::$ROOT no tiene backend.tf; se omite el plan"
          fi

      - if: steps.backend.outputs.present == 'true'
        uses: ./.github/actions/tf-init
        with:
          root: ${{ matrix.root }}
          terraform_version: ${{ env.TF_VERSION }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_PLAN }}
          state_bucket: ${{ vars.TF_STATE_BUCKET }}

      # La SA de plan es de solo lectura: no puede tomar el lock del estado.
      - id: plan
        if: steps.backend.outputs.present == 'true'
        continue-on-error: true
        run: |
          terraform -chdir="$ROOT" plan -input=false -lock=false -no-color -out=tfplan | tee "$ROOT/plan.txt"
          terraform -chdir="$ROOT" show -json tfplan >"$ROOT/plan.json"

      # Costo mensual estimado del plan (Pipeline, paso 3). Informativo: no bloquea el PR.
      - if: steps.plan.outcome == 'success' && env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - id: infracost
        if: steps.plan.outcome == 'success' && env.INFRACOST_API_KEY != ''
        continue-on-error: true
        run: infracost breakdown --path "$ROOT/plan.json" --no-color | tee "$ROOT/infracost.txt"

      - if: steps.plan.outcome == 'success'
        uses: ./.github/actions/setup-conftest

      - id: policy
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        run: conftest test --no-color --policy gcp-datacenter/policies "$ROOT/plan.json" | tee "$ROOT/conftest.txt"

      - name: Comentario con el resumen del plan
        if: always() && steps.backend.outputs.present == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '');
            const cut = (s, n) => (s.length > n ? s.slice(0, n) + '\n... (truncado, ver el log del job)' : s);
            const plan = read(`${root}/plan.txt`);
            const policy = read(`${root}/conftest.txt`);
            const cost = read(`${root}/infracost.txt`);
            const total = (cost.match(/OVERALL TOTAL\s+(\S+)/) || [null, cost ? '(sin total)' : 'omitido (sin INFRACOST_API_KEY)'])[1];
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['(sin resumen)'])[0];
            const icon = (o) => (o === 'success' ? 'ok' : o === 'skipped' || o === '' ? 'omitido' : 'FALLA');
            const marker = `<!-- tf-plan:${root} -->`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Plan \`${root}\``,
              `- Plan: **${icon(process.env.PLAN_OUTCOME)}**. ${summary}`,
              `- Políticas (conftest): **${icon(process.env.POLICY_OUTCOME)}**`,
              `- Costo mensual estimado (Infracost): **${total}**`,
              `- [Ejecución](${run})`,
              '',
              '<details><summary>Salida del plan</summary>',
              '',
              '```text',
              cut(plan, 55000),
              '```',
              '</details>',
              '',
              '<details><summary>Infracost</summary>',
              '',
              '```text',
              cut(cost, 10000),
              '```',
              '</details>',
              '',
              '<details><summary>Conftest</summary>',
              '',
              '```text',
              cut(policy, 5000),
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Resultado
        if: steps.backend.outputs.present == 'true'
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
        run: |
          [ "$PLAN_OUTCOME" = success ] || { echo "::error::terraform plan falló en $ROOT"; exit 1; }
          [ "$POLICY_OUTCOME" = success ] || { echo "::error::el plan de $ROOT viola políticas (ver comentario del PR)"; exit 1; }

  # Único check obligatorio en la protección de main: los jobs de matriz cambian de nombre según las raíces
  # afectadas, así que se resumen aquí. Falla si algún job falló o se canceló; "skipped" cuenta como bien.
  ci-ok:
    if: always()
    needs: [detect, fmt, tflint, checkov, policy-tests, script-tests, module-tests, terratest-compile, validate, plan]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            case $r in success | skipped) ;; *) echo "::error::un job de CI terminó en $r"; exit 1 ;; esac
          done
